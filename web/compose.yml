# API + Redis run in Docker. The inference worker runs on the host
# (systemd unit deploy/systemd/audio-fidelity-worker.service) with the engine's
# own .venv-linux. Data and engine directories are mounted at the SAME absolute
# paths as on the host, so paths stored in SQLite are valid on both sides.
name: audio-fidelity-demo

services:
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf, --requirepass, "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    # Host-local only: used by the host worker; never exposed publicly.
    ports: ['127.0.0.1:${REDIS_PORT:-6380}:6379']
    volumes:
      - redis-data:/data
      - ./deploy/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

  api:
    image: audio-fidelity-demo:${RELEASE:-latest}
    build: {context: .}
    restart: unless-stopped
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TMPDIR: ${DATA_ROOT:?set DATA_ROOT in .env}/temp/sys
      HOME: ${DATA_ROOT}/temp/home
    command: [uvicorn, webapp.main:app, --host, 0.0.0.0, --port, '8000', --proxy-headers,
              --forwarded-allow-ips, '*', --no-server-header]
    ports: ['127.0.0.1:${HTTP_PORT:-8896}:8000']
    volumes:
      - ${DATA_ROOT}:${DATA_ROOT}
      # Read-only: BUILD_INFO (engine version) and the admin health check.
      - ${ENGINE_ROOT:?set ENGINE_ROOT in .env}:${ENGINE_ROOT}:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '5'}}

volumes:
  redis-data:
