# 宝塔 Nginx 站点：/www/server/panel/vhost/nginx/audio-fidelity.xinghexingsui.com.conf
# 443 由 stream 按 SNI 分流（带 PROXY 协议头）默认转发到 8443，所以 HTTPS 监听 8443 proxy_protocol。
# 端口 8896 与 .env 中 HTTP_PORT 一致。

server {
    listen 80;
    server_name audio-fidelity.xinghexingsui.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-challenge;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name audio-fidelity.xinghexingsui.com;

    ssl_certificate     /etc/letsencrypt/live/audio-fidelity.xinghexingsui.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio-fidelity.xinghexingsui.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 20 MiB 上传 + multipart 开销；应用层另有逐块计数限制
    client_max_body_size 21m;
    client_body_timeout 120s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 麦克风只允许本站使用
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:8896;
        # 宝塔 proxy.conf 在 http 层全局开启了 proxy_cache：会吞掉 Range 请求，
        # 且带登录态的接口不应经过共享缓存，这里显式关闭。
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    access_log /www/wwwlogs/audio-fidelity.xinghexingsui.com.log;
    error_log  /www/wwwlogs/audio-fidelity.xinghexingsui.com.error.log;
}
